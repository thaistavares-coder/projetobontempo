schema: spec-driven

context: |
  Project: Sistema de Gestão de Consultório.

  Domain:
  Sistema para gerenciamento de pacientes, profissionais,
  disponibilidades de atendimento e agendamentos de um consultório.

  Tech stack:
  Backend: Xano e XanoScript.
  Frontend: Python e Streamlit.
  Ferramentas: Git, GitHub, Visual Studio Code,
  GitHub Copilot, Xano Developer MCP e OpenSpec.

  Architecture:
  O Xano será utilizado como backend da aplicação.
  O Streamlit será utilizado para desenvolver a interface web.
  O frontend deverá consumir as APIs HTTP disponibilizadas pelo Xano.
  O frontend não deverá acessar diretamente o banco de dados.
  As regras de negócio, validações e integridade dos dados
  deverão ser tratadas preferencialmente no backend.

  Security:
  Regras de autorização e integridade não devem depender
  exclusivamente do frontend.
  Credenciais, tokens e informações sensíveis não devem
  ser armazenados em arquivos versionados.

  Development:
  O projeto será desenvolvido de forma incremental utilizando OpenSpec.
  Mudanças relevantes deverão ser especificadas antes da implementação.
  O frontend será desenvolvido em Python utilizando Streamlit.
  As funcionalidades do frontend deverão respeitar as
  especificações existentes e os endpoints reais do Xano.
  O agente deverá consultar AGENTS.md, docs/project-overview.md
  e docs/domain-model.md antes de alterações significativas.

  Language:
  Escrever a documentação do projeto e os artefatos
  OpenSpec em português brasileiro.

rules:
  proposal:
    - Descrever claramente o problema, objetivo e escopo da mudança.
    - Identificar o que está fora do escopo quando necessário.

  specs:
    - Escrever requisitos verificáveis.
    - Utilizar cenários para comportamentos relevantes.
    - Considerar regras relacionadas a pacientes, profissionais,
      disponibilidade e conflitos de agendamento quando aplicável.

  tasks:
    - Dividir a implementação em tarefas pequenas e verificáveis.
    - Evitar alterações não relacionadas à mudança atual.

operations:
  apply:
    guidance:
      - Consultar a documentação relevante antes da implementação.
      - Executar verificações relevantes antes de concluir as tarefas.
      - Validar XanoScript utilizando as ferramentas disponíveis quando apropriado.

  archive:
    guidance:
      - Confirmar que a implementação corresponde à especificação.
      - Confirmar que as tarefas da mudança foram concluídas.